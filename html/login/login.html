<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login/Register - RecycleNow</title>
    <link rel="stylesheet" href="../../Assets/css/globalStyles.css" />
    <link rel="stylesheet" href="../navfoot/navbar.css" />
    <link rel="stylesheet" href="../navfoot/footer.css" />
    <link rel="stylesheet" href="./loginstyles.css" />
  </head>
  <body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <div id="main-content" style="min-height: 400px">
      <!-- Login Form -->
      <div class="login-form-container">
        <img
          class="form-img"
          loading="lazy"
          src="../../Assets/Images/reuse.jpg"
          alt="recycle quote"
        />
        <form id="login" action="" method="get" style="width: 70%">
          <div class="login-details">
            <div class="input-item">
              <label for="username">Username:</label>
              <input type="text" id="username" name="username" />
            </div>
            <div class="input-item">
              <label for="password">Password:</label>
              <input type="password" id="password" name="password" />
            </div>
          </div>
          <div class="submit-or-register" style="width: 100%; height: 30%">
            <button type="submit" class="submit-button">Login</button>
            <h5>Don't have an account yet? Click below to register</h5>
            <button type="button" class="submit-button" id="show-register">
              Register
            </button>
          </div>
        </form>
      </div>

      <!-- Registration Form -->
      <div class="register-form-container">
        <form
          id="register"
          action=""
          method="post"
          style="display: none; border-radius: 10px; padding: 2rem"
        >
          <section class="user-details" style="width: 100%">
            <div class="input-item">
              <label for="first-name">First Name:</label>
              <input type="text" id="first-name" name="first_name" />
            </div>
            <div class="input-item">
              <label for="last-name">Last Name:</label>
              <input type="text" id="last-name" name="last_name" />
            </div>
            <div class="input-item">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" />
            </div>
            <div class="input-item">
              <label for="phone">Phone Number:</label>
              <input type="text" id="phone" name="phone" />
            </div>
            <div class="input-item">
              <label for="address">Home/Company Address:</label>
              <input type="text" id="address" name="address" />
            </div>
            <div class="input-item">
              <label for="postcode">Postcode:</label>
              <input type="text" id="postcode" name="postcode" />
            </div>
          </section>
          <section class="user-validation" style="width: 100%">
            <div class="input-item">
              <label for="username-reg">Username:</label>
              <input type="text" id="username-reg" name="username" />
            </div>
            <div class="input-item">
              <label for="user-type">User Type:</label>
              <input type="text" id="user-type" name="user_type" />
            </div>
            <div class="input-item">
              <label for="password-reg">Password:</label>
              <input type="password" id="password-reg" name="password" />
            </div>
            <div class="input-item">
              <label for="confirm-password">Confirm Password:</label>
              <input
                type="password"
                id="confirm-password"
                name="confirm_password"
              />
            </div>
          </section>
          <button type="submit" class="submit-button">Register</button>
        </form>
      </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../navfoot/navbar.js" defer></script>
    <script src="../shop/basket.js" defer></script>
    <script src="../navfoot/footer.js" defer></script>
    <script src="../../Assets/js/loginScripts.js" defer></script>
  </body>
</html>
