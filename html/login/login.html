<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - RecycleNow</title>
    <link rel="stylesheet" href="../../Assets/css/globalStyles.css" />
    <link rel="stylesheet" href="../navfoot/navbar.css" />
    <link rel="stylesheet" href="../navfoot/footer.css" />
    <link rel="stylesheet" href="./loginstyles.css" />
  </head>
  <body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <div id="main-content" style="min-height: 400px">
      <!-- Login Form -->
      <div class="login-form-container">
        <img
          class="form-img"
          loading="lazy"
          src="../../Assets/Images/reuse.jpg"
          alt="recycle quote"
        />
        <form id="login" action="" method="get" style="width: 70%">
          <div class="login-details">
            <div class="input-item">
              <label for="username">Username:</label>
              <input type="text" id="username" name="username" />
            </div>
            <div class="input-item">
              <label for="password">Password:</label>
              <input type="password" id="password" name="password" />
            </div>
          </div>
          <div class="submit-or-register" style="width: 100%; height: 30%">
            <button type="submit" class="submit-button">Login</button>
            <h5>Don't have an account yet? Click below to register</h5>
            <a href="register.html" class="submit-button">Register</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../navfoot/navbar.js" defer></script>
    <script src="../shop/basket.js" defer></script>
    <script src="../navfoot/footer.js" defer></script>
    <script src="./loginScripts.js" defer></script>
  </body>
</html>
