<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Details - RecycleNow</title>
    <link rel="stylesheet" href="../../Assets/css/globalStyles.css" />
    <link rel="stylesheet" href="../navfoot/navbar.css" />
    <link rel="stylesheet" href="../navfoot/footer.css" />
    <link rel="stylesheet" href="./account.css" />
  </head>
  <body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main>
      <h1>Account Details</h1>
      <div class="account-container">
        <form id="account-form">
          <h2>Personal Information</h2>
          <div class="input-item">
            <label for="first-name">First Name:</label>
            <input type="text" id="first-name" name="first_name" required />
          </div>
          <div class="input-item">
            <label for="last-name">Last Name:</label>
            <input type="text" id="last-name" name="last_name" required />
          </div>
          <div class="input-item">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" required />
          </div>
          <h2>Address</h2>
          <div class="input-item">
            <label for="street">Street:</label>
            <input type="text" id="street" name="street" required />
          </div>
          <div class="input-item">
            <label for="house-no">House Number/Postcode:</label>
            <input type="text" id="house-no" name="house_no" required />
          </div>
          <div class="input-item">
            <label for="town">Town:</label>
            <input type="text" id="town" name="town" />
          </div>
          <div class="input-item">
            <label for="city">City:</label>
            <input type="text" id="city" name="city" />
          </div>
          <div class="input-item">
            <label for="county">County:</label>
            <input type="text" id="county" name="county" />
          </div>
          <h2>Username and Password</h2>
          <div class="input-item">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="input-item">
            <label for="new-password">New Password:</label>
            <input type="password" id="new-password" name="new_password" />
          </div>
          <div class="input-item">
            <label for="confirm-password">Confirm Password:</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm_password"
            />
          </div>
          <button type="submit">Save Changes</button>
        </form>
      </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../navfoot/navbar.js"></script>
    <script src="../shop/basket.js"></script>
    <script src="../navfoot/footer.js"></script>
    <script src="./account.js"></script>
  </body>
</html>
