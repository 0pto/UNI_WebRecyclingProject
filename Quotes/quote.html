<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get A Quote</title>
    <link rel="stylesheet" href="./quoteStyles.css">
</head>

<body>
    <!-- navigation bar-->
    <nav class="navbar" id="navbar-container"></nav>

    <!-- Posts content -->
    <div id="mainContent">
        <div id="title">
            <h3>Select the services you need below:</h3>
        </div>
        <!--All the services-->
        <div class="servicesSelection">
            <div id="serviceItem">
                <img id="serviceItemImg" loading="lazy" src="../Assets/Images/businessWaste.jpg" alt="profile picture"
                    height="150px" width="150px">
                <div class="username">
                    <label for="busines">Business Waste</label>
                    <select name="busines" id="Busines">
                        <option value="">Business Waste option 1</option>
                        <option value="">Business Waste option 2</option>
                        <option value="">Business Waste option 3</option>
                        <option value="">Business Waste option 4</option>
                        <option value="">Business Waste option 5</option>
                    </select>
                </div>
            </div>
            <div id="serviceItem">
                <img id="serviceItemImg" loading="lazy" src="../Assets/Images/domesticWaste.jpg" alt="profile picture"
                    height="150px" width="150px">
                <div class="username">
                    <label for="domestic">Domestic Waste</label>
                    <select name="domestic" id="domestic">
                        <option value="">Domestic Waste option 1</option>
                        <option value="">Domestic Waste option 2</option>
                        <option value="">Domestic Waste option 3</option>
                        <option value="">Domestic Waste option 4</option>
                        <option value="">Domestic Waste option 5</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="submit-button">Submit</button>
        </div>

        <!-- This section contains a table that will display the quote after subtion -->
        <div class="displayQuote">


        </div>
    </div>

    <!-- footer -->
    <!-- footer -->
    <footer class="sb_footer section_padding" id="footer-container">
    </footer>
</body>
<!-- include the scripts with a defer attribute so that the scripts load only after all the element have rendered -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js" defer></script>
<script src="../Assets/js/navbar.js" defer></script>
<script src="../Assets/js/footer.js" defer></script>

</html>
