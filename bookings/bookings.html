<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recycling Pickup Bookings - RecycleNow</title>
  <link rel="stylesheet" href="../Assets/css/index.css" />
  <link rel="stylesheet" href="bookings.css" />
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar" id="navbar-container-home"></nav>

  <!-- Main Content -->
  <div class="main-content">
    <h1>Recycling Pickup Bookings</h1>

    <!-- Tabs for Single and Multi Bookings -->
    <div class="booking-tabs">
      <button id="singleTab" class="tab active">Single Booking</button>
      <button id="multiTab" class="tab">Multi Booking</button>
    </div>

    <!-- Single Booking Form -->
    <div id="singleBookingForm" class="booking-form">
      <h2>Single Booking</h2>
      <form id="singleBookingSubmit">
        <div class="form-group">
          <label for="singleDate">Pickup Date</label>
          <input type="date" id="singleDate" name="date" required />
        </div>
        <div class="form-group">
          <label for="singleAddress">Pickup Address</label>
          <input type="text" id="singleAddress" name="address" required placeholder="Enter address" />
        </div>
        <div class="form-group">
          <label for="singleItemType">Item Type</label>
          <select id="singleItemType" name="itemtype" required>
            <option value="" disabled selected>Select item type</option>
            <option value="Paper">Paper</option>
            <option value="Plastic">Plastic</option>
            <option value="Electronics">Electronics</option>
            <option value="Glass">Glass</option>
          </select>
        </div>
        <div class="form-group">
          <label for="singlePrice">Estimated Price</label>
          £<input type="number" id="singlePrice" name="price" step="0.01" readonly
            placeholder="Calculated by backend" />
        </div>
        <button type="submit" class="submit-button">
          Submit Single Booking
        </button>
      </form>
      <p id="singleError" class="error-message"></p>
      <p id="singleSuccess" class="success-message"></p>
    </div>

    <!-- Multi Booking Form -->
    <div id="multiBookingForm" class="booking-form hidden">
      <h2>Multi Booking</h2>
      <form id="multiBookingSubmit">
        <div class="form-group">
          <label for="multiStartDate">Start Date</label>
          <input type="date" id="multiStartDate" name="startdate" required />
        </div>
        <div class="form-group">
          <label for="multiEndDate">End Date</label>
          <input type="date" id="multiEndDate" name="enddate" />
          <label for="indefiniteCheckbox" style="display: inline; margin-left: 10px">
            <input type="checkbox" id="indefiniteCheckbox" name="indefinite" />
            Indefinite
          </label>
        </div>
        <div class="form-group">
          <label for="multiCollectDay">Collection Day</label>
          <select id="multiCollectDay" name="collectday" required>
            <option value="" disabled selected>Select collection day</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
          </select>
        </div>
        <div class="form-group">
          <label for="multiAddress">Pickup Address</label>
          <input type="text" id="multiAddress" name="address" required placeholder="Enter address" />
        </div>
        <div class="form-group">
          <label for="multiItemType">Item Type</label>
          <select id="multiItemType" name="itemtype" required>
            <option value="" disabled selected>Select item type</option>
            <option value="Paper">Paper</option>
            <option value="Plastic">Plastic</option>
            <option value="Electronics">Electronics</option>
            <option value="Glass">Glass</option>
          </select>
        </div>
        <div class="form-group">
          <label for="multiBinSize">Bin Size</label>
          <select id="multiBinSize" name="binsize" required>
            <option value="" disabled selected>Select bin size</option>
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
          </select>
        </div>
        <div class="form-group">
          <label for="multiPrice">Estimated Price</label>
          £<input type="text" id="multiPrice" name="price" step="0.01" readonly placeholder="Calculated by backend" />
        </div>
        <button type="submit" class="submit-button">
          Submit Multi Booking
        </button>
      </form>
      <p id="multiError" class="error-message"></p>
      <p id="multiSuccess" class="success-message"></p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="sb_footer section_padding" id="footer-container"></footer>

  <!-- Scripts -->
  <script src="../Assets/js/navbar.js" defer></script>
  <script src="../Assets/js/footer.js" defer></script>
  <script src="bookings.js" defer></script>
</body>

</html>
