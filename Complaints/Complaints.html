<html style="background-color: #cfd3da;">
    <head>
        <link rel="stylesheet" href="Complaints.css"></link>
    </head>
    <body>
        <form id="complaint-form" action="" method="post">
            <span class="textbox">
                <h1 style="text-align: center;">Complaint Form</h1>
                <label for="Subject">Complaint Subject</label><br>
                <input type="text" id="Subject" style="width: 50%; height: 5%;"><br>
                <label for="Description">Complaint Description</label><br>
                <textarea id="Description" style="width: 80%; height: 30%; resize: none;"></textarea><br>
                <div style="text-align: center;">
                    <br>
                    <button type="submit" formmethod="post">Submit</button>
                </div>
            </span>
        </form>
        <script src="./complaintsScripts.js" defer></script>
    </body>
</html>
