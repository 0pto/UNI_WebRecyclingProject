<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - RecycleNow</title>
    <link rel="stylesheet" href="./styles/checkout.css" />
</head>

<body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main>
        <h1>Checkout</h1>
        <div class="checkout-container">
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="summary-items"></div>
                <p>Total: $<span id="checkout-total">0.00</span></p>
            </div>
            <div class="checkout-form">
                <h2>Shipping Information</h2>
                <form id="checkout-form">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" required />
                    <label for="address">Address:</label>
                    <input type="text" id="address" required />
                    <label for="email">Email:</label>
                    <input type="email" id="email" required />

                    <h2>Payment Information</h2>
                    <label for="card-number">Credit Card Number:</label>
                    <input type="text" id="card-number" maxlength="19" placeholder="1234 5678 9012 3456" required />
                    <label for="card-holder">Name on Card:</label>
                    <input type="text" id="card-holder" class="medium-input" required />
                    <div class="small-input-group">
                        <div>
                            <label for="exp-date">Expiration Date (MM/YY):</label>
                            <input type="text" id="exp-date" class="small-input" maxlength="5" placeholder="MM/YY"
                                required />
                        </div>
                        <div>
                            <label for="sec-code">Security Code:</label>
                            <input type="text" id="sec-code" class="small-input" maxlength="4" placeholder="123"
                                required />
                        </div>
                    </div>

                    <button type="submit">Place Order</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="../../Assets/js/navbar.js"></script>
    <script src="../../Assets/js/basket.js"></script>
    <script src="../Assets/js/footer.js"></script>
    <script src="../../Assets/js/checkout.js"></script>
</body>

</html>
