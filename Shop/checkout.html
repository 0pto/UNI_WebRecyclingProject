<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link rel="stylesheet" href="./checkout.css" />
  </head>
  <body>
    <nav class="navbar" id="navbar-container"></nav>

    <div id="mainContent" class="main-content">
      <h3>Checkout</h3>
      <div class="checkout-container">
        <!-- Order Summary -->
        <div id="price-breakdown"></div>

        <!-- Shipping and Bank Details -->
        <div class="shipping-bank-details">
          <!-- Shipping -->
          <div class="form-section">
            <h4>Shipping Information</h4>
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" disabled />

            <label for="surname">Surname</label>
            <input type="text" id="surname" disabled />

            <label for="address">Address</label>
            <input type="text" id="address" placeholder="123 Main St" />

            <label for="postcode">Postcode</label>
            <input type="text" id="postcode" placeholder="AB12 3CD" />

            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="01234 567890" />
          </div>

          <!-- Payment -->
          <div class="form-section">
            <h4>Bank Details</h4>
            <label for="card-number">Card Number</label>
            <input
              type="text"
              id="card-number"
              placeholder="1234 5678 9012 3456"
            />

            <label for="expiry-date">Expiry Date</label>
            <input type="text" id="expiry-date" placeholder="MM/YY" />

            <label for="cvv">CVV</label>
            <input type="text" id="cvv" placeholder="123" />
          </div>
        </div>
      </div>

      <!-- Checkout Button -->
      <div class="flex justify-end mt-6">
        <button class="submit-button" onclick="placeOrder()">
          Place Order
        </button>
      </div>
    </div>

    <footer class="sb_footer section_padding" id="footer-container"></footer>
    <script src="../Assets/js/navbar.js" defer></script>
    <script src="./checkout.js" defer></script>
    <script src="../Assets/js/footer.js" defer></script>
  </body>
</html>
